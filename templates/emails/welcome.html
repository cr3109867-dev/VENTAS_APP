<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
        }
        
        .card {
            background-color: #fff;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        
        h2 {
            color: #2c3e50;
        }
        
        p {
            font-size: 14px;
            color: #555;
        }
        
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>

<body>
    <div class="card">
        <h2>¡Bienvenido, {{ nombre }}!</h2>
        <p>Tu registro fue exitoso en el sistema de ventas.</p>
        <p>Ahora puedes iniciar sesión y comenzar a gestionar tus productos y ventas.</p>
        <div class="footer">© 2026 Sistema de Ventas</div>
    </div>
</body>

</html>
