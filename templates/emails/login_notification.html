<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            padding: 20px;
        }
        
        .card {
            background-color: #fff;
            border-radius: 8px;
            padding: 20px;
            border: 1px solid #ddd;
        }
        
        h2 {
            color: #27ae60;
        }
        
        p {
            font-size: 14px;
            color: #333;
        }
        
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #aaa;
        }
    </style>
</head>

<body>
    <div class="card">
        <h2>Inicio de sesión exitoso</h2>
        <p>Hola {{ nombre }}, acabas de iniciar sesión en el sistema de ventas.</p>
        <p>Si no reconoces esta actividad, por favor cambia tu contraseña.</p>
        <div class="footer">© 2026 Sistema de Ventas</div>
    </div>
</body>

</html>
