{% extends "base.html" %} {% block title %}Editar producto{% endblock %} {% block content %}
<div class="container">
    <h1>Editar producto</h1>

    <form method="POST" class="card p-4 shadow-sm">
        <div class="form-group mb-3">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre" class="form-control" value="{{ producto.nombre }}" required>
        </div>

        <div class="form-group mb-3">
            <label for="categoria">Categoría</label>
            <input type="text" id="categoria" name="categoria" class="form-control" value="{{ producto.categoria }}" required>
        </div>

        <div class="form-group mb-3">
            <label for="precio">Precio</label>
            <input type="number" id="precio" name="precio" class="form-control" value="{{ producto.precio }}" required>
        </div>

        <div class="form-group mb-3">
            <label for="cantidad">Cantidad</label>
            <input type="number" id="cantidad" name="cantidad" class="form-control" value="{{ producto.cantidad }}" required>
        </div>

        <div class="form-group mb-3">
            <label for="proveedor">Proveedor</label>
            <input type="text" id="proveedor" name="proveedor" class="form-control" value="{{ producto.proveedor }}" required>
        </div>

        <div class="d-flex justify-content-between mt-3">
            <!-- Botón cancelar con tu estilo -->
            <a href="{{ url_for('inventario') }}" class="btn cancelar">❌ Cancelar</a>
            <!-- Botón actualizar con tu estilo -->
            <button type="submit" class="btn editar">💾 Actualizar</button>
        </div>
    </form>
</div>
{% endblock %}
