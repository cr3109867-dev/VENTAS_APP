<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Factura {{ numero }}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        
        h2 {
            text-align: center;
        }
        
        .info {
            margin-bottom: 20px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        
        th,
        td {
            border: 1px solid #333;
            padding: 8px;
            text-align: center;
        }
        
        th {
            background-color: #f2f2f2;
        }
        
        .totales {
            margin-top: 20px;
            text-align: right;
        }
    </style>
</head>

<body>
    <h2>Factura {{ numero }}</h2>

    <div class="info">
        <p><strong>Negocio:</strong> {{ negocio }}</p>
        <p><strong>Fecha:</strong> {{ venta[0] }}</p>
        <p><strong>Cliente:</strong> {{ venta[1] }}</p>
    </div>

    <table>
        <thead>
            <tr>
                <th>Producto</th>
                <th>Cantidad</th>
                <th>Precio</th>
                <th>Subtotal</th>
            </tr>
        </thead>
        <tbody>
            {% for p in productos %}
            <tr>
                <td>{{ p[0] }}</td>
                <td>{{ p[1] }}</td>
                <td>${{ "%.2f"|format(p[2]) }}</td>
                <td>${{ "%.2f"|format(p[1] * p[2]) }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <div class="totales">
        <p><strong>Total:</strong> ${{ "%.2f"|format(venta[2]) }}</p>
    </div>
</body>

</html>
