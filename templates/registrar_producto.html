{% extends "base.html" %} {% block title %}Registrar producto{% endblock %} {% block content %}
<div class="container">
    <h2>Registrar nuevo producto</h2>

    <form method="POST" class="form-producto">
        <div class="form-group">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" placeholder="Ej: Arroz 1kg" required>
        </div>

        <div class="form-group">
            <label for="categoria">Categoría:</label>
            <input type="text" id="categoria" name="categoria" placeholder="Ej: Granos" required>
        </div>

        <div class="form-group">
            <label for="precio">Precio:</label>
            <input type="number" step="0.01" id="precio" name="precio" placeholder="Ej: 5000" required>
        </div>

        <div class="form-group">
            <label for="cantidad">Cantidad:</label>
            <input type="number" id="cantidad" name="cantidad" placeholder="Ej: 50" required>
        </div>

        <div class="form-group">
            <label for="proveedor">Proveedor:</label>
            <input type="text" id="proveedor" name="proveedor" placeholder="Ej: Distribuidora La 14" required>
        </div>

        <button type="submit" class="btn guardar">
            <i class="fas fa-save"></i> Guardar producto
        </button>
    </form>
</div>
{% endblock %}
