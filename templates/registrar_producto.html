{% extends "base.html" %} {% block title %}Registrar producto{% endblock %} {% block content %}
<div class="container mt-4">
    <!-- Encabezado -->
    <h2 class="border-bottom pb-2 text-center mb-4">
        📝 Registrar nuevo producto en {{ negocio_actual|capitalize }}
    </h2>

    <!-- Formulario -->
    <form method="POST" class="form-producto shadow-sm p-4 rounded">
        <div class="mb-3">
            <label for="nombre" class="form-label fw-semibold">Nombre</label>
            <input type="text" id="nombre" name="nombre" class="form-control" placeholder="Ej: Camiseta" required>
        </div>

        <div class="mb-3">
            <label for="categoria" class="form-label fw-semibold">Categoría</label>
            <input type="text" id="categoria" name="categoria" class="form-control" placeholder="Ej: Ropa" required>
        </div>

        <div class="mb-3">
            <label for="precio" class="form-label fw-semibold">Precio</label>
            <input type="number" step="0.01" id="precio" name="precio" class="form-control" placeholder="Ej: 5000" required>
        </div>

        <div class="mb-3">
            <label for="cantidad" class="form-label fw-semibold">Cantidad</label>
            <input type="number" id="cantidad" name="cantidad" class="form-control" placeholder="Ej: 50" required>
        </div>

        <div class="mb-3">
            <label for="proveedor" class="form-label fw-semibold">Proveedor</label>
            <input type="text" id="proveedor" name="proveedor" class="form-control" placeholder="Ej: Distribuidora La 14" required>
        </div>

        <div class="mb-3">
            <label for="codigo_barras" class="form-label fw-semibold">Código de barras</label>
            <input type="text" id="codigo_barras" name="codigo_barras" class="form-control" placeholder="Escanee el producto aquí">
            <small class="text-muted">Use la pistola lectora para llenar este campo automáticamente.</small>
        </div>

        <!-- Botón -->
        <button type="submit" class="btn btn-success fw-bold shadow-sm px-4">
            💾 Guardar producto
        </button>
    </form>
</div>
{% endblock %}
