{% extends "base.html" %} {% block title %}Login{% endblock %} {% block content %}

<div class="container mt-5">
    <div class="row justify-content-center align-items-center" style="min-height: 70vh;">
        <div class="col-md-5">
            <div class="card shadow-lg border-0 p-4 bg-dark text-light">

                <!-- HEADER -->
                <div class="text-center mb-4">
                    <h2 class="fw-bold">🔐 Iniciar sesión</h2>
                    <p class="text-muted">Accede a tu cuenta para continuar</p>
                </div>

                <!-- FORM -->
                <form method="POST" action="{{ url_for('login') }}" onsubmit="mostrarLoader()">
                    <!-- CORREO -->
                    <div class="mb-3">
                        <label class="form-label">Correo electrónico</label>
                        <input type="email" class="form-control" name="correo" id="correo" placeholder="ejemplo@gmail.com" required>
                    </div>

                    <!-- PASSWORD -->
                    <div class="mb-3">
                        <label class="form-label">Contraseña</label>
                        <div class="input-group">
                            <input type="password" class="form-control" name="contraseña" id="contraseña" required>
                            <button type="button" class="btn btn-outline-secondary" onclick="togglePassword()">👁️</button>
                        </div>
                    </div>

                    <!-- BOTÓN -->
                    <button type="submit" id="btnLogin" class="btn btn-primary w-100">
                        Iniciar sesión
                    </button>
                </form>

                <!-- LINKS -->
                <div class="text-center mt-3">
                    <a href="{{ url_for('forgot_password') }}">¿Olvidaste tu contraseña?</a>
                </div>
                <div class="text-center mt-2">
                    <small>
                        ¿No tienes cuenta?
                        <a href="{{ url_for('register') }}">Regístrate</a>
                    </small>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- SCRIPT PRO -->
<script>
    function togglePassword() {
        const input = document.getElementById("contraseña");
        input.type = input.type === "password" ? "text" : "password";
    }

    function mostrarLoader() {
        const btn = document.getElementById("btnLogin");
        btn.innerHTML = "Ingresando...";
        btn.disabled = true;
    }
</script>

{% endblock %}
