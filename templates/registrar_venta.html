{% extends "base.html" %} {% block title %}Registrar venta{% endblock %} {% block content %}

<div class="container mt-4">

    <div class="mb-4">
        <h2>💰 Registrar Venta</h2>
        <p class="text-muted">Selecciona el producto y registra la venta</p>
    </div>

    <div class="card shadow p-4">

        <form method="POST" onsubmit="return confirmarVenta()">

            <!-- PRODUCTO -->
            <div class="mb-3">
                <label class="form-label">Producto</label>

                <select id="producto_id" name="producto_id" class="form-select" required onchange="actualizarStock()">
                    {% for producto in productos %}
                    <option value="{{ producto.id }}" data-stock="{{ producto.cantidad }}">
                        {{ producto.nombre }} (Stock: {{ producto.cantidad }})
                    </option>
                    {% endfor %}
                </select>

                <small id="stockInfo" class="text-muted"></small>
            </div>

            <!-- CANTIDAD -->
            <div class="mb-3">
                <label class="form-label">Cantidad</label>
                <input type="number" id="cantidad" name="cantidad" class="form-control" min="1" required>

                <div id="errorStock" class="text-danger mt-1" style="display:none;">
                    ❌ No hay suficiente stock
                </div>
            </div>

            <!-- CLIENTE -->
            <div class="mb-3">
                <label class="form-label">Cliente</label>
                <input type="text" id="cliente" name="cliente" class="form-control" placeholder="Ej: Juan Pérez" required>
            </div>

            <!-- BOTÓN -->
            <button type="submit" class="btn btn-success w-100">
                💾 Registrar Venta
            </button>

        </form>

    </div>

</div>

<!-- SCRIPT PRO -->
<script>
    function actualizarStock() {
        const select = document.getElementById("producto_id");
        const stock = select.options[select.selectedIndex].dataset.stock;
        document.getElementById("stockInfo").innerText = "Stock disponible: " + stock;
    }

    document.getElementById("cantidad").addEventListener("input", function() {
        const cantidad = parseInt(this.value);
        const select = document.getElementById("producto_id");
        const stock = parseInt(select.options[select.selectedIndex].dataset.stock);

        const error = document.getElementById("errorStock");

        if (cantidad > stock) {
            error.style.display = "block";
        } else {
            error.style.display = "none";
        }
    });

    function confirmarVenta() {
        const cantidad = parseInt(document.getElementById("cantidad").value);
        const select = document.getElementById("producto_id");
        const stock = parseInt(select.options[select.selectedIndex].dataset.stock);

        if (cantidad > stock) {
            alert("❌ Stock insuficiente");
            return false;
        }

        return confirm("¿Confirmar esta venta?");
    }

    // inicializar
    window.onload = actualizarStock;
</script>

{% endblock %}
