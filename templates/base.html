<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>{% block title %}Ventas App{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
    <header>
        <h1>Ventas App</h1>
        <nav>
            <a href="{{ url_for('index') }}"><i class="fas fa-home"></i> Inicio</a>
            <a href="{{ url_for('inventario') }}"><i class="fas fa-boxes"></i> Inventario</a>
            <a href="{{ url_for('ventas') }}"><i class="fas fa-receipt"></i> Ventas</a>
            <a href="{{ url_for('registrar_producto') }}"><i class="fas fa-plus-square"></i> Registrar producto</a>
            <a href="{{ url_for('registrar_venta') }}"><i class="fas fa-cash-register"></i> Registrar venta</a>
            <a href="{{ url_for('reporte') }}"><i class="fas fa-chart-line"></i> Reporte</a>
        </nav>
    </header>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>© 2026 Ventas App - Desarrollado por horizonte innova</p>
    </footer>
</body>

</html>
